  summary: >
    Ruixian Hao works on geoscience applications of low-cost GNSS receivers,
    high-precision GNSS-IR/GNSS-MR algorithms, and key tropospheric parameters
    for GNSS meteorology and atmospheric remote sensing. His recent work
