work:
  - name: National Key Laboratory of Air-Ground Integrated New Navigation System Technology, Beihang University
    position: Research Intern
    displayDate: Jul 2024 - Sep 2024
    location: Beijing, China
    highlights:
      - Investigated ionospheric-scintillation effects on ADS-B civil-aviation trajectories using dual-frequency GNSS carrier-phase combinations.
      - Removed satellite-clock, tropospheric, and relativistic effects to estimate residual-based scintillation indicators.

projects:
  - name: ERA5-SH Global Scale-Height Dataset
    url: https://github.com/HaoRuixian/ERA5-SH-dataset-for-troposphere-parameters-code-for-estimate-and-analysis
    summary: Reproducible global dataset and processing workflow for tropospheric-parameter scale heights derived from ERA5 profiles.
    highlights:
      - Estimated ZTD, ZHD, ZWD, Tm, PWV, and WVD scale heights and validated them with 591 radiosonde stations.
      - Published as a first-author Scientific Data paper; data released on Zenodo with 2,873 combined downloads as of July 9, 2026.

  - name: GMR-Water
    url: https://github.com/HaoRuixian/GNSS-IR-Kit
    summary: Open-source MATLAB software for multi-GNSS, multi-frequency, and multi-observation GNSS-MR water-level retrieval.
    highlights:
      - Supports SNR, carrier-phase, and pseudorange strategies, batch processing, quality control, visualization, and accuracy evaluation.
      - Published as a second-author GPS Solutions software paper.

