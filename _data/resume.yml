projects:
  - name: ERA5-SH Dataset
    url: https://github.com/HaoRuixian/ERA5-SH-dataset-for-troposphere-parameters-code-for-estimate-and-analysis
    summary: Global gridded scale-height dataset for ZTD, ZHD, ZWD, Tm, PWV, and WVD derived from ERA5 reanalysis profiles.
    highlights:
      - Built exponential-fitting workflows for tropospheric-parameter scale heights.
      - Validated products with global radiosonde-derived scale heights.
      - Dataset released on Zenodo in two parts with 2,873 combined downloads as of 2026-07-09.

  - name: GMR-Water
    url: https://github.com/HaoRuixian/GNSS-IR-Kit
    summary: MATLAB software for GNSS-MR water-level retrieval with multi-GNSS, multi-frequency, and multi-observation processing.
    highlights:
      - Supports SNR, carrier-phase, and pseudo-range retrieval strategies.
      - Provides GUI, quality control, visualization, and accuracy-evaluation workflows.

  - name: Water Vapor Scale Height in China Climate Zones
    summary: Analysis of water vapor scale-height variation and driving factors across Chinese climate zones.
    highlights:
      - Used radiosonde observations from 89 stations during 2016-2019.
      - Quantified spatial-temporal patterns and potential impacts on GNSS water vapor modeling.
